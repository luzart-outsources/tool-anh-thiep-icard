<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem thiệp</title>
<style>
  :root { --bg:#16181b; --panel:#1f2226; --line:#30343a; --text:#e8e4da; --muted:#9a968c; --accent:#d6b36a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { display:flex; gap:20px; padding:16px; min-height:100vh; }
  .stage-col { flex:1; display:flex; justify-content:center; align-items:flex-start; }
  .stage { position:relative; height:calc(100vh - 32px); max-width:100%; border-radius:4px; overflow:hidden;
           box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .stage img { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; }
  .stage.caro { background:repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/24px 24px; }
  .stage.den { background:#000; } .stage.trang { background:#fff; }
  .hl { position:absolute; border:2px solid var(--accent); pointer-events:none; display:none; }
  aside { width:300px; flex:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px;
          height:calc(100vh - 32px); overflow:auto; position:sticky; top:16px; }
  h1 { font-size:16px; margin:0 0 2px; } .sub { color:var(--muted); margin-bottom:14px; }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
  label { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; }
  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { flex:1; background:none; border:0; color:var(--text); padding:7px 4px; cursor:pointer; font:inherit; }
  .seg button.on { background:var(--accent); color:#1b1b1b; font-weight:600; }
  .play { width:100%; margin-top:10px; padding:9px; border-radius:6px; border:0; background:var(--accent);
          color:#1b1b1b; font:inherit; font-weight:600; cursor:pointer; }
  .play:disabled { opacity:.4; cursor:default; }
  ul { list-style:none; margin:0; padding:0; } li.p { padding:3px 6px; border-radius:4px; cursor:default;
       display:flex; justify-content:space-between; gap:6px; } li.p:hover { background:#2a2e33; }
  li.p small { color:var(--muted); } .warn { color:#f0b36a; font-size:13px; margin:4px 0; }
  @media (max-width: 760px) { .wrap { flex-direction:column; padding:16px; } aside { width:auto; height:auto; position:static; }
    .stage { height:auto; width:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage-col"><div class="stage caro" id="stage"><div class="hl" id="hl"></div></div></div>
  <aside>
    <h1 id="title"></h1><div class="sub" id="sub"></div>
    <h2>Chế độ</h2>
    <div class="seg" id="mode"><button data-v="layers" class="on">3 layer</button><button data-v="pieces">Mảnh + hiệu ứng</button></div>
    <button class="play" id="play" disabled>▶ Chạy hiệu ứng</button>
    <h2>Hiển thị</h2>
    <label><input type="checkbox" data-layer="nen" checked> 01 · Nền</label>
    <label><input type="checkbox" data-layer="hoa_van" checked> 02 · Hoa văn</label>
    <label><input type="checkbox" data-layer="text" checked> 03 · Chữ</label>
    <h2>Nền xem vùng trong suốt</h2>
    <div class="seg" id="bgsel"><button data-v="caro" class="on">Caro</button><button data-v="den">Đen</button><button data-v="trang">Trắng</button></div>
    <h2>Mảnh (<span id="np"></span>)</h2>
    <ul id="plist"></ul>
    <div id="warns"></div>
  </aside>
</div>
<script>
const M = /*__MANIFEST__*/null;
const stage = document.getElementById('stage'), hl = document.getElementById('hl');
const W = M.canvas.w, H = M.canvas.h;
stage.style.aspectRatio = W + ' / ' + H;
document.getElementById('title').textContent = M.kit + ' · ' + M.layout;
document.getElementById('sub').textContent = W + ' × ' + H + ' px · ' + M.generator;
const show = { nen: true, hoa_van: true, text: true };
let mode = 'layers';
const allPieces = [...M.pieces.map(p => ({ ...p, layer: 'hoa_van' })), ...M.texts.map(t => ({ ...t, layer: 'text', type: 'text' }))]
  .filter(p => p.file);
document.getElementById('np').textContent = allPieces.length;

function img(src, cls) { const i = new Image(); i.src = src; i.draggable = false; if (cls) i.dataset.layer = cls; return i; }
function build() {
  stage.querySelectorAll('img').forEach(e => e.remove());
  const nen = img(M.layers[0].file, 'nen'); stage.insertBefore(nen, hl);
  if (mode === 'layers') {
    stage.insertBefore(img(M.layers[1].file, 'hoa_van'), hl);
    stage.insertBefore(img(M.layers[2].file, 'text'), hl);
  } else {
    allPieces.forEach(p => { const i = img(p.file, p.layer); i.dataset.id = p.id; stage.insertBefore(i, hl); });
  }
  apply();
  document.getElementById('play').disabled = mode !== 'pieces';
}
function apply() { stage.querySelectorAll('img').forEach(i => i.style.visibility = show[i.dataset.layer] ? 'visible' : 'hidden'); }
document.querySelectorAll('[data-layer]').forEach(cb => cb.addEventListener('change', () => { show[cb.dataset.layer] = cb.checked; apply(); }));
function seg(id, fn) { const el = document.getElementById(id); el.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); }); }
seg('mode', v => { mode = v; build(); });
seg('bgsel', v => { stage.className = 'stage ' + v; });

function kf(p) {
  const [x, y, w, h] = p.bbox, cx = (x + w / 2) / W, cy = (y + h / 2) / H;
  if (p.type === 'text') return [{ opacity: 0, transform: 'translateY(1.2%)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }];
  if (p.type === 'border') return [{ opacity: 0 }, { opacity: 1 }];
  if (p.type === 'rule' || (w > 3 * h && h < H * 0.06))
    return [{ clipPath: `inset(0 ${100 - (cx * 100)}% 0 ${cx * 100}%)`, opacity: .2 }, { clipPath: 'inset(0 0 0 0)', opacity: 1 }];
  if (/goc|corner/.test(p.id)) {
    const dx = cx < .5 ? -4 : 4, dy = cy < .5 ? -3 : 3;
    return [{ opacity: 0, transform: `translate(${dx}%, ${dy}%)` }, { opacity: 1, transform: 'none' }];
  }
  if (w > W * 0.4) return [{ opacity: 0, transform: 'scale(.86)', transformOrigin: `${cx * 100}% ${cy * 100}%` },
                            { opacity: 1, transform: 'none', transformOrigin: `${cx * 100}% ${cy * 100}%` }];
  return [{ opacity: 0, transform: 'translateY(1.5%)' }, { opacity: 1, transform: 'none' }];
}
document.getElementById('play').addEventListener('click', () => {
  let d = 0;
  stage.querySelectorAll('img[data-id]').forEach(i => {
    const p = allPieces.find(q => q.id === i.dataset.id && q.layer === i.dataset.layer);
    const isText = p.type === 'text';
    i.animate(kf(p), { duration: isText ? 900 : 1100, delay: d, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });
    d += isText ? 260 : 110;
  });
});

const pl = document.getElementById('plist');
allPieces.forEach(p => {
  const li = document.createElement('li'); li.className = 'p';
  li.innerHTML = `<span></span><small></small>`;
  li.firstChild.textContent = p.id; li.lastChild.textContent = p.layer === 'text' ? 'chữ' : p.type;
  li.addEventListener('mouseenter', () => { const [x, y, w, h] = p.bbox;
    Object.assign(hl.style, { display: 'block', left: x / W * 100 + '%', top: y / H * 100 + '%', width: w / W * 100 + '%', height: h / H * 100 + '%' }); });
  li.addEventListener('mouseleave', () => hl.style.display = 'none');
  pl.appendChild(li);
});
const wr = document.getElementById('warns');
(M.warnings || []).forEach(w => { const d = document.createElement('div'); d.className = 'warn'; d.textContent = '⚠ ' + w; wr.appendChild(d); });
build();
</script>
</body>
</html>
